[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-ui"
version = "0.1.0"
description = "Liquid-glass UI layer for tkinter on Windows: real desktop blur behind your window, plus fully self-drawn widgets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jiyihao" }]
keywords = ["tkinter", "gui", "glass", "blur", "acrylic", "windows", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/jiyihao/glass-ui"
Source = "https://github.com/jiyihao/glass-ui"

[tool.setuptools]
packages = ["glass_ui"]
