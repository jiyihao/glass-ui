[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-ui"
version = "0.1.8"
description = "Liquid-glass UI layer for tkinter on Windows: real desktop blur behind your window, plus fully self-drawn widgets (the engine behind MemTidy, a Windows memory optimizer)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jiyihao" }]
keywords = [
    "tkinter", "gui", "glass", "liquid-glass", "glassmorphism",
    "blur", "acrylic", "mica", "windows", "desktop", "ui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/jiyihao/memtidy"
Repository = "https://github.com/jiyihao/memtidy"
Issues = "https://github.com/jiyihao/memtidy/issues"
Changelog = "https://github.com/jiyihao/memtidy/releases"

[tool.setuptools]
packages = ["glass_ui"]
